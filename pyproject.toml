[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-101"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "lerobot[feetech,placo-dep, dataset, smolvla]",
    "pygame>=2.6",
]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
lerobot = { path = "lerobot", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["robot101*"]
namespaces = false

[tool.setuptools.package-data]
robot101 = ["legacy/simulation/assets/so101/**/*", "calibration/*.md"]
